<h1>📚 Урок 1 — Что такое Termux</h1>

<p>
Termux — это терминал Linux на Android.  
Он позволяет запускать команды, устанавливать пакеты и писать код прямо на телефоне.
</p>

<h3>💡 Зачем он нужен:</h3>
<ul>
  <li>Программирование</li>
  <li>Создание ботов</li>
  <li>Работа с GitHub</li>
</ul>

<h3>🚀 Первая команда:</h3>
<pre>pkg update</pre>

<pre>pkg upgrade</pre>
