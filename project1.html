<h1>🚀 Проект 1 — Telegram бот</h1>

<p>Создание простого Telegram бота на Python.</p>

<h3>📦 Установка:</h3>
<pre>pip install pyTelegramBotAPI</pre>

<h3>💡 Код:</h3>
<pre>
import telebot

bot = telebot.TeleBot("TOKEN")

@bot.message_handler(func=lambda m: True)
def echo(m):
    bot.reply_to(m, m.text)

bot.polling()
