<h1>⚙️ Проект 2 — Мини сайт</h1>

<p>
Ты создашь свой первый веб-сайт прямо в Termux.
</p>

<h3>📦 Установка сервера:</h3>
<pre>pkg install python</pre>

<h3>🚀 Запуск сайта:</h3>
<pre>python -m http.server 8000</pre>

<h3>🌐 Открытие:</h3>
<p>http://localhost:8000</p>

<p>Теперь у тебя локальный сайт на телефоне.</p>
